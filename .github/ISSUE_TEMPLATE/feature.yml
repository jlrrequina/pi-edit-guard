name: Feature request
description: A tool to classify, a coverage gap, or a behaviour you would like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today? Which invariant (freshness, reversibility, progress) does it touch?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
